<script type="text/javascript">
  RED.nodes.registerType('levoit-purifier', {
    category: 'smart home',
    color: '#78c1a5',
    icon: 'font-awesome/fa-wind',
    defaults: {
      name: { value: '' },
      account: { value: '', type: 'levoit-config', required: true },
      deviceCid: { value: '' },
      configModule: { value: '' },
      deviceName: { value: '' },
      pollInterval: { value: 60 },
    },
    inputs: 1,
    outputs: 1,
    paletteLabel: 'levoit purifier',
    label: function () {
      return this.name || this.deviceName || 'Levoit Purifier';
    },
    oneditprepare: function () {
      var node = this;
      var deviceSelect = $('#node-input-deviceCid');
      var refreshBtn = $('#levoit-refresh-devices');
      var statusEl = $('#levoit-device-status');

      function loadDevices() {
        var configId = $('#node-input-account').val();
        if (!configId || configId === '_ADD_') {
          deviceSelect.empty().append('<option value="">-- Deploy config first --</option>');
          return;
        }

        statusEl.text('Loading devices...').css('color', '#666');
        deviceSelect.empty().append('<option value="">Loading...</option>');

        $.getJSON('levoit/devices?configId=' + configId, function (devices) {
          deviceSelect.empty();
          if (!devices || devices.length === 0) {
            deviceSelect.append('<option value="">-- No devices found --</option>');
            statusEl.text('No devices found. Deploy config node first.').css('color', 'orange');
            return;
          }

          deviceSelect.append('<option value="">-- Select device --</option>');
          devices.forEach(function (d) {
            var label = d.name + ' (' + d.type + ')' + (d.online === 'online' ? ' ●' : ' ○');
            var opt = $('<option></option>')
              .val(d.cid)
              .text(label)
              .data('configModule', d.configModule)
              .data('deviceName', d.name);
            if (d.cid === node.deviceCid) {
              opt.prop('selected', true);
            }
            deviceSelect.append(opt);
          });

          statusEl.text(devices.length + ' device(s) found').css('color', 'green');
        }).fail(function () {
          deviceSelect.empty().append('<option value="">-- Error loading --</option>');
          statusEl.text('Failed to load devices. Is the config node deployed?').css('color', 'red');
        });
      }

      // When device selection changes, update hidden fields
      deviceSelect.on('change', function () {
        var selected = $(this).find(':selected');
        $('#node-input-configModule').val(selected.data('configModule') || '');
        $('#node-input-deviceName').val(selected.data('deviceName') || '');
      });

      // Refresh button
      refreshBtn.on('click', loadDevices);

      // Load devices when config node changes
      $('#node-input-account').on('change', function () {
        setTimeout(loadDevices, 200);
      });

      // Initial load
      loadDevices();
    },
  });
</script>

<script type="text/html" data-help-name="levoit-purifier">
  <p>Controls a Levoit air purifier via the VeSync cloud API.</p>

  <h3>Input</h3>
  <p>Send a message to control the purifier:</p>
  <ul>
    <li><code>msg.payload = "on"</code> — Turn on</li>
    <li><code>msg.payload = "off"</code> — Turn off</li>
    <li><code>msg.payload = { action: "speed", value: 2 }</code> — Set fan speed (1-4)</li>
    <li><code>msg.payload = { action: "mode", value: "auto" }</code> — Set mode (manual/auto/sleep)</li>
    <li><code>msg.payload = "status"</code> — Poll current status</li>
    <li><code>msg.payload = "display_on"</code> / <code>"display_off"</code> — Toggle display</li>
    <li><code>msg.payload = "child_lock_on"</code> / <code>"child_lock_off"</code> — Toggle child lock</li>
  </ul>

  <h3>Output</h3>
  <p>Outputs the current device status as <code>msg.payload</code> after every command and on each poll interval.</p>
  <p>Status includes: <code>powerSwitch</code>, <code>workMode</code>, <code>fanSpeedLevel</code>,
     <code>PM25</code>, <code>filterLifePercent</code>, <code>screenSwitch</code>, <code>childLockSwitch</code>.</p>

  <h3>Configuration</h3>
  <p>Select a Levoit account (config node) and choose a device from the dropdown.
     The device list is fetched dynamically from the VeSync API. Make sure to <strong>deploy</strong>
     the config node first before selecting a device.</p>
  <p>Poll interval sets how often (in seconds) the node queries device status. Set to 0 to disable auto-polling.</p>
</script>
